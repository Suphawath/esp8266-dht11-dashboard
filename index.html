<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP8266 Smart Environment</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 15px;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  color: #f1f5f9;
  background: linear-gradient(135deg, #081426, #142b4b);
}

.container {
  max-width: 760px;
  margin: auto;
}

header {
  text-align: center;
  padding: 25px 10px;
}

h1 { font-size: 26px; }

.subtitle {
  color: #a8bdd8;
  font-size: 14px;
}

.status {
  display: inline-block;
  padding: 8px 14px;
  margin-top: 15px;
  border-radius: 30px;
  background: #26364b;
  color: #cbd5e1;
  font-size: 13px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.card {
  padding: 25px 12px;
  text-align: center;
  border: 1px solid #30445d;
  border-radius: 22px;
  background: rgba(255,255,255,0.07);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.card h2 {
  color: #b9cbe0;
  font-size: 16px;
  font-weight: normal;
}

.value {
  font-size: clamp(30px, 7vw, 44px);
  font-weight: bold;
  margin: 18px 0;
}

.temp { color: #fbbf69; }
.humidity { color: #67d8ff; }

footer {
  margin-top: 28px;
  text-align: center;
  color: #a8bdd8;
  font-size: 13px;
  line-height: 1.9;
}

@media (max-width: 400px) {
  .cards { gap: 10px; }
  .card { padding: 20px 7px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div style="font-size:42px">🌐</div>
  <h1>SMART ENVIRONMENT</h1>
  <div class="subtitle">
    ESP8266 + DHT11 Temperature & Humidity
  </div>
  <div class="status" id="connection">
    กำลังเชื่อมต่อข้อมูล...
  </div>
</header>

<div class="cards">
  <section class="card">
    <div style="font-size:36px">🌡️</div>
    <h2>อุณหภูมิ</h2>
    <div class="value temp">
      <span id="temp">--.-</span> °C
    </div>
    <div class="subtitle">Temperature</div>
  </section>

  <section class="card">
    <div style="font-size:36px">💧</div>
    <h2>ความชื้นสัมพัทธ์</h2>
    <div class="value humidity">
      <span id="hum">--</span> %
    </div>
    <div class="subtitle">Humidity</div>
  </section>
</div>

<footer>
  <div id="updated">รอข้อมูลจากเซนเซอร์</div>
  <div>Data source: ThingSpeak Cloud</div>
  <div>ESP8266 IoT Dashboard</div>
</footer>

</div>

<script>
// แก้เป็น Channel ID ของคุณ
const CHANNEL_ID = "YOUR_CHANNEL_ID";

// ดึงข้อมูลล่าสุดจาก Channel ที่ตั้งเป็น Public
async function updateData() {
  const status = document.getElementById("connection");

  try {
    const url =
      `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=1`;

    const response = await fetch(url, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    const feeds = data.feeds;

    if (!feeds || feeds.length === 0) {
      throw new Error("ยังไม่มีข้อมูล");
    }

    const latest = feeds[feeds.length - 1];
    const temperature = Number(latest.field1);
    const humidity = Number(latest.field2);

    if (
      latest.field1 === null || latest.field2 === null ||
      !Number.isFinite(temperature) ||
      !Number.isFinite(humidity)
    ) {
      throw new Error("ข้อมูลเซนเซอร์ไม่ครบ");
    }

    document.getElementById("temp").textContent =
      temperature.toFixed(1);

    document.getElementById("hum").textContent =
      humidity.toFixed(0);

    status.textContent = "● รับข้อมูลจาก Cloud สำเร็จ";
    status.style.color = "#6ee7b7";

    const time = new Date(latest.created_at);

    document.getElementById("updated").textContent =
      "เวลาข้อมูลล่าสุด: " +
      time.toLocaleString("th-TH");

  } catch (error) {
    status.textContent = "ไม่สามารถดึงข้อมูลได้";
    status.style.color = "#fca5a5";

    document.getElementById("updated").textContent =
      "ตรวจสอบ Channel ID, การเชื่อมต่อ และข้อมูลใน ThingSpeak";
    console.error(error);
  }
}

// อ่านครั้งแรกทันที
updateData();

// อัปเดตหน้าเว็บทุก 20 วินาที
setInterval(updateData, 20000);
</script>

</body>
</html>
